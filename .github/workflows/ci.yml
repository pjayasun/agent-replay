name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-groups --no-editable --python ${{ matrix.python }}
      - run: uv run --no-editable ruff check .
      - run: uv run --no-editable mypy src
      - run: uv run --no-editable pytest --cov=agent_replay --cov-report=term-missing
      - run: uv build
      - run: uv run --no-editable python examples/mock_agent.py
      - run: uv run --no-editable python examples/observed_agent.py
